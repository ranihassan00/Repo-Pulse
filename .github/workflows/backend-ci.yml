name: Backend CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_import:
        description: Import octocat/Hello-World and verify restart persistence (uses GitHub public API quota)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: bash mvnw --batch-mode verify
      - name: Build and start Compose
        working-directory: .
        env:
          DATABASE_PASSWORD: ci-local-database-only
        run: |
          docker compose config --quiet
          docker compose up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health; then exit 0; fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Check empty repository API
        run: curl --fail --silent http://localhost:8080/api/repositories | python3 -c 'import json,sys; assert json.load(sys.stdin) == []'
      - name: Live import and reimport
        if: inputs.live_import == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-smoke]'))
        working-directory: .
        run: python3 scripts/smoke_test.py import /tmp/repopulse-smoke.json
      - name: Restart backend and verify persistence
        if: inputs.live_import == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-smoke]'))
        working-directory: .
        env:
          DATABASE_PASSWORD: ci-local-database-only
        run: |
          docker compose restart backend
          python3 scripts/smoke_test.py verify /tmp/repopulse-smoke.json
      - name: Stop containers
        if: always()
        working-directory: .
        env:
          DATABASE_PASSWORD: ci-local-database-only
        run: docker compose down
